spring:
  application:
    name: fitbite
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitbite}
    username: ${DB_USERNAME:fitbite}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
